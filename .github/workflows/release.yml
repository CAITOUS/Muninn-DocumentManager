name: Release

# Publishes a GitHub Release with the downloadable package whenever main contains a
# Muninn version that hasn't been released yet (the version is read from Muninn.html).
#
# Release assets:
#   - Muninn.html               the app on its own
#   - muninn-<version>.zip      the full package (app, guides, sign-in relay, examples, license)
#
# To release: bump `version` in Muninn.html (and muninn.json + CHANGELOG.md), push to main.

on:
  push:
    branches: [main]
    paths: ['Muninn.html', 'muninn.json', 'CHANGELOG.md', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Re-upload assets even if this version is already released'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Muninn.html
        id: v
        run: |
          VER=$(grep -oE "version:'[0-9]+\.[0-9]+\.[0-9]+[^']*'" Muninn.html | head -1 | sed -E "s/version:'([^']+)'/\1/")
          [ -n "$VER" ] || { echo "::error::Could not find version in Muninn.html"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "Muninn version: $VER"

      - name: Check muninn.json matches
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          grep -q "\"latest\": *\"${{ steps.v.outputs.ver }}\"" muninn.json \
            || echo "::warning::muninn.json 'latest' is not ${{ steps.v.outputs.ver }}; existing copies won't be told about this release"

      - name: Build package
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          NAME="muninn-${{ steps.v.outputs.ver }}"
          mkdir -p "dist/$NAME"
          cp -r Muninn.html index.html README.md LICENSE.md CHANGELOG.md muninn.json docs relay examples "dist/$NAME/"
          (cd dist && zip -qr "$NAME.zip" "$NAME" && cp "$NAME/Muninn.html" Muninn.html)
          ls -la dist

      - name: Release notes
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          awk -v v="## ${{ steps.v.outputs.ver }}" 'index($0,v)==1 {f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo ""
            echo "### Get Muninn"
            echo "- **Launch in your browser (no download):** https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "- **App only:** \`Muninn.html\`, download and open in Chrome, Edge or Brave"
            echo "- **Full package:** \`muninn-${{ steps.v.outputs.ver }}.zip\`, app plus guides, sign-in relay, examples and license"
          } >> notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          FILES="dist/Muninn.html dist/muninn-${{ steps.v.outputs.ver }}.zip"
          if [ "${{ steps.v.outputs.exists }}" = "true" ]; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "Muninn ${{ steps.v.outputs.ver }}" --notes-file notes.md --latest
          fi

      - name: Nothing to do
        if: steps.v.outputs.exists == 'true' && !inputs.rebuild
        run: echo "Version ${{ steps.v.outputs.ver }} is already released. Bump the version in Muninn.html to publish a new release."
