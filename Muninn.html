const HELP=[
 ['overview','What Muninn does',()=>`<p class="lead">Muninn helps teams write, organise and publish <b>Standard Operating Procedures (SOPs)</b> and <b>Knowledge Base Articles (KBAs)</b> in one consistent, branded format, then keep them current as people review and improve them.</p>
   <div class="tour" id="tour"></div>
   <div class="row" style="margin:14px 0"><button class="btn pri" onclick="startDemo()">▶ Try it with sample documents</button><span class="hint">Opens a sample clinic’s SOP and KBAs. Nothing you do in the demo is saved.</span></div>
   ${DIA.modes()}<h3>What you get</h3><ul class="hl"><li><b>Templates that guide the writer:</b> SOPs follow <b>Why → Who → What → How</b>; KBAs follow problem → cause → fix, or task → steps → result.</li><li><b>Branding and document control:</b> logo, colours, document IDs, version, owner, approver, review dates, and a change log, on every page.</li><li><b>Plain files you own:</b> documents are Markdown (.md) files with properties, readable in Obsidian, GitHub, or any editor. Nothing is locked inside Muninn.</li><li><b>Review built in:</b> in a GitHub repo, every change goes through a pull request; approvals follow your organisation’s GitHub rules.</li><li><b>Exports:</b> branded Word, HTML (print to PDF), and Markdown.</li></ul>`],
 ['quickstart','Quick start (5 minutes)',()=>`<ol class="hsteps"><li><b>Connect.</b> Click the connection label at the top right (or <a href="#connect">Connect</a>). Pick a folder, a GitHub repo, or “Continue without connecting” to try it in this browser.</li>${IMG('connect')}<li><b>Brand.</b> Open <a href="#setup">Company &amp; Brand</a>: company name, logo (600 × 200 px or larger, transparent PNG), and a theme. Only the name is required.</li>${IMG('brand')}<li><b>Start a document.</b> On <a href="#templates">Templates</a>, click <b>New draft</b> on an SOP or KBA, or <b>Import a document…</b> to convert one you already have.</li>${IMG('templates')}<li><b>Write.</b> Fill in the form; the preview on the right is the finished document. Empty sections show grey guidance text so gaps are obvious.</li><li><b>Share.</b> Use <b>Export</b> for Word, HTML or Markdown. In a folder or repo, the document is already saved as a file.</li></ol>`],
 ['writing','Writing an SOP or KBA',()=>`${IMG('editor')}<h3>The SOP structure</h3><table class="list"><tbody><tr><td><b>WHY</b></td><td>Purpose, scope (and what’s out of scope), and why it matters: the risk or cost of skipping it.</td></tr><tr><td><b>WHO</b></td><td>The audience and a roles table: who performs, covers, and owns it.</td></tr><tr><td><b>WHAT</b></td><td>Definitions, prerequisites, tools, and the outputs the procedure produces.</td></tr><tr><td><b>HOW</b></td><td>Numbered steps, how to verify success, and what to do when something goes wrong.</td></tr></tbody></table>
   <h3>The header</h3><p>Title, department, sequence number, version, status, owner, approver, effective date, next review (defaults to effective date + your review cycle) and classification. The <b>document ID</b> is built from your naming settings, e.g. <span class="mono">NWD-SOP-IT-004</span>.</p>
   <h3>Versions and the change log</h3><p><b>+0.1</b> records a minor revision; <b>+1.0</b> records an approved release. Each adds a row to the Revision History. The last page of every document lists the changes since the last major version.</p>
   <h3>Tips</h3><ul class="hl"><li>Start each step with a verb, one action per step.</li><li>Leave a gap rather than guessing: write <span class="mono">[TBD: approver]</span>.</li><li>The completeness bar shows how much of the template is filled in.</li></ul>`],
 ['steps','Steps, cautions & screenshots',()=>`${IMG('steps')}<ul class="hl"><li>Each step has an <b>action</b> (bold line), <b>detail</b>, and an optional <b>caution</b>, shown as a highlighted warning.</li><li>Add images with <b>+ Image</b>, by <b>pasting</b> a screenshot into the detail box, or by <b>dragging</b> a file onto the step. Add a caption under each image.</li><li>Large images are resized to 1600 px. In a folder or repo they’re saved as files in <span class="mono">assets/</span> next to the document, so Obsidian and GitHub show them too.</li><li>Use ↑ ↓ to reorder steps and ✕ to remove one.</li></ul>`],
 ['properties','Properties',()=>`<p>Properties are the labelled values at the top of each Markdown file (Obsidian shows them in its Properties panel). Muninn shows <b>whatever properties a document already has</b>, even ones it has never seen, and writes them back unchanged.</p><ul class="hl"><li><b>Add</b> a property (text, list, date, number or yes/no) at the bottom of the Properties box.</li><li><b>Remove</b> one with ✕ (click twice to confirm).</li><li>Header fields (title, version, owner…) are properties too; they’re edited in the header form.</li><li>If you can’t edit the source (read-only folder or GitHub role), properties are shown but locked.</li></ul>`],
 ['references','References & related files',()=>`${IMG('explorer')}<p>Click <b>📂 Browse files…</b> under References (SOPs) or Related Articles (KBAs).</p><ul class="hl"><li>Browse this library or other GitHub repos you’ve connected to, or type <span class="mono">owner/repo</span> to open another.</li><li>Tick files as you go; they collect in the <b>Selected</b> list on the left, where you can review and remove them before adding.</li><li>Other documents become <span class="mono">[[wiki-links]]</span> (Obsidian follows them); other files become relative links; files in other repos become GitHub links.</li></ul>`],
 ['import','Importing & migrating documents',()=>`${DIA.import()}${IMG('import')}<ul class="hl"><li>Open <b>Import / migrate…</b> in the Library (or <b>Import a document…</b> on Templates).</li><li><b>From your computer:</b> Word (.docx), Markdown (.md), web pages (.html) or text (.txt). Obsidian notes keep their properties.</li><li><b>From this library:</b> Muninn lists files in your folder or repo that it doesn’t manage yet. Import one, and optionally move the original to <span class="mono">_Archive</span> (folder) or remove it in the same pull request (repo).</li><li><b>Older drafts</b> saved in the previous <span class="mono">.sopkba.json</span> format can be converted to Markdown in one click.</li><li>Confidence dots: green = sure, amber = guessed, grey = no match. Change any match with its dropdown, or highlight text to send just that part somewhere else. <b>✨ Ask AI to map</b> can do a first pass.</li><li>Anything that doesn’t fit a section is kept under <b>Other sections</b>; nothing is dropped.</li></ul>`],
 ['ai','AI assist (bring your own AI)',()=>`<p><b>✨ AI assist</b> in the editor drafts or improves sections using an AI you choose. Nothing changes until you review each proposed section and tick what to keep.</p><table class="list"><tbody><tr><td><b>Any AI: copy &amp; paste</b></td><td>Works everywhere. Copy the prompt into ChatGPT, Copilot, Gemini or a local model; paste the reply back. No keys.</td></tr><tr><td><b>Claude (built-in)</b></td><td>When Muninn is opened inside Claude.</td></tr><tr><td><b>OpenAI, Anthropic, Gemini, Azure OpenAI</b></td><td>Desktop copy, using your own API key.</td></tr><tr><td><b>Local models</b> (Ollama, LM Studio)</td><td>Any OpenAI-compatible address. Keeps content on your own hardware.</td></tr><tr><td><b>Webhook</b> (n8n, Power Automate)</td><td>Send the request to your own workflow.</td></tr></tbody></table><p class="hint">Keys stay in your browser and are never written to shared folders, repos or backups. The AI is told to write <span class="mono">[TBD]</span> instead of inventing names, numbers or settings, but always check its work.</p>`],
 ['local','Local mode (folders)',()=>`<ul class="hl"><li><b>Connect → Choose folder…</b> and pick any folder you can reach. Muninn asks your browser for permission; next time click <b>Reconnect</b>.</li><li>Documents are saved automatically as <span class="mono">SOP/&lt;DEPT&gt;/&lt;ID&gt; - &lt;Title&gt;.md</span>, images in <span class="mono">assets/</span>, company settings in <span class="mono">_templater/company.json</span>. Deleted documents move to <span class="mono">_Archive</span>.</li><li>Point everyone at the same <b>OneDrive / SharePoint-synced folder or network share</b> to share a library. If two people edit the same document, Muninn asks whose version to keep.</li><li>Open the same folder as an <b>Obsidian vault</b> to read and link documents there.</li><li><b>Browser:</b> needs a Chromium browser (Chrome, Edge, Brave). Brave turns folder access off by default: open <span class="mono">brave://flags/#file-system-access-api</span>, choose Enabled, relaunch.</li></ul>`],
 ['repo','Repo mode (GitHub review & approval)',()=>`${DIA.publish()}${IMG('repo')}<h3>Who can do what</h3><table class="list"><thead><tr><th>Your GitHub role</th><th>In Muninn</th></tr></thead><tbody><tr><td>Read</td><td>View documents; comment on pull requests.</td></tr><tr><td>Write / Triage</td><td>Create and edit drafts, commit, open pull requests, review others’ work.</td></tr><tr><td>Maintain / Admin</td><td>Also merge (publish), subject to your branch rules.</td></tr></tbody></table>
   <h3>Day to day</h3><ol class="hsteps"><li>Edit as usual. The header shows how many documents have uncommitted changes until you commit them. Muninn warns you if you try to close the page with uncommitted changes.</li><li>Type <b>What changed?</b> and click <b>Commit &amp; open PR</b>. Editing a published document bumps its version automatically.</li><li>Reviewers open the document, read the comments, and click <b>Approve</b> or <b>Request changes</b>. GitHub doesn’t allow authors to approve their own work.</li><li>Someone with permission clicks <b>Merge &amp; publish</b>. The merge records who approved it; see <b>Git history</b> under the panel.</li></ol>`],
 ['admin','Admin setup (GitHub & sign-in)',()=>`${DIA.admin()}<ol class="hsteps"><li><b>Create a GitHub App</b> owned by your organisation: Contents and Pull requests read &amp; write, Metadata read, <b>Enable Device Flow</b> ticked. Install it on the docs repo only.</li><li><b>Deploy the sign-in relay</b> (a small Cloudflare Worker in the <span class="mono">relay/</span> folder of Muninn’s repository, about 15 minutes). It passes GitHub’s sign-in through for the browser and stores nothing. Without a relay, staff can sign in with personal access tokens instead.</li><li><b>Connect once</b> as a maintainer, pick the publish branch and docs folder, and click <b>Set up docs here</b>. Muninn adds a small <span class="mono">.switchboard-docs.json</span> file that marks the folder and holds your branding.</li><li>Click <b>Preconfigured app</b> and share the downloaded file with staff. It opens with the repo and sign-in already set.</li><li>Protect the publish branch: require at least one approving review. Muninn follows whatever rules you set.</li></ol><p class="hint">Branding changes made while connected to a repo are proposed as a pull request (<b>Propose change</b> on Company &amp; Brand).</p>`],
 ['exports','Exports, naming & backups',()=>`${IMG('export')}<ul class="hl"><li><b>Word (.docx):</b> branded header and footer, page numbers, screenshots and the change note.</li><li><b>HTML:</b> open in a browser and print to PDF.</li><li><b>Markdown:</b> for wikis and other tools.</li><li><b>Blank templates:</b> each template card can export an empty, branded version.</li><li><b>Document IDs:</b> choose the parts (company code, type, department, number, version), their order and separator on Company &amp; Brand.</li><li><b>Backups:</b> in browser-only mode, use <b>Export backup</b> and <b>Import backup</b> in the Library to move or keep a copy.</li></ul>`],
 ['trouble','Troubleshooting',()=>`<table class="list"><thead><tr><th>You see</th><th>What to do</th></tr></thead><tbody>
   <tr><td>“Folder access is blocked” / no folder button</td><td>Use the desktop copy in Chrome, Edge or Brave (Brave: enable <span class="mono">brave://flags/#file-system-access-api</span>).</td></tr>
   <tr><td>“GitHub can’t be reached from inside the Claude viewer”</td><td>Open the desktop copy (Connect → Download desktop version).</td></tr>
   <tr><td>“Could not reach the sign-in relay”</td><td>Check the relay address; opening it in a browser should show <span class="mono">{"ok":true}</span>.</td></tr>
   <tr><td><span class="mono">client_id_not_allowed</span></td><td>The Client ID in Muninn must exactly match the relay’s <span class="mono">CLIENT_ID</span>.</td></tr>
   <tr><td>“Repo not found” after signing in</td><td>The GitHub App isn’t installed on that repo, or your account can’t see it.</td></tr>
   <tr><td>Merge button says “Blocked by branch rules”</td><td>The pull request still needs an approval or passing checks.</td></tr>
   <tr><td>“Changed in the folder by someone else”</td><td>Choose <b>Load theirs</b> (discard yours) or <b>Keep mine</b> (overwrite).</td></tr>

   <p>Signing out: <b>Sign out &amp; disconnect</b> removes your saved GitHub sign-in from this browser. On shared computers, always sign out.</p>`],

function vHelp(){const sec=HELP.find(h=>h[0]===HELP_SEC)||HELP[0];
  $('#view').innerHTML=`<div class="help"><aside class="hnav"><div class="hint" style="font-weight:700;letter-spacing:.6px;margin:0 0 6px 10px">HELP GUIDE</div>${HELP.map(h=>`<a href="#help-${h[0]}" class="${h===sec?'on':''}">${esc(h[1])}</a>`).join('')}
    <div style="margin:14px 10px 0">${DEMO?'<button class="btn sm" onclick="exitDemo()">Exit demo</button>':'<button class="btn sm pri" onclick="startDemo()">▶ Try the demo</button>'}</div></aside>
   <article class="hbody"><h1>${esc(sec[1])}</h1>${sec[2]()}<div class="hpn">${(()=>{const i=HELP.indexOf(sec);return `${i>0?`<a class="btn sm" href="#help-${HELP[i-1][0]}">← ${esc(HELP[i-1][1])}</a>`:''}<span class="spacer"></span>${i<HELP.length-1?`<a class="btn sm" href="#help-${HELP[i+1][0]}">${esc(HELP[i+1][1])} →</a>`:''}`})()}</div></article></div>`;
  if($('#tour'))drawTour()}
function drawTour(){const el=$('#tour');if(!el)return;const has=typeof HELP_IMG!=='undefined';const [k,t,d]=TOUR[TOUR_I];
  el.innerHTML=`<div class="tslide">${has&&HELP_IMG[k]?`<img src="${HELP_IMG[k]}" alt="">`:''}<div class="tcap"><b>${esc(t)}</b><span>${esc(d)}</span></div></div>
   <div class="row" style="justify-content:center;margin-top:8px"><button class="btn sm ghost" onclick="tourGo(-1)">‹</button>${TOUR.map((_,i)=>`<i class="tdot ${i===TOUR_I?'on':''}" onclick="tourGo(${i}-TOUR_I)"></i>`).join('')}<button class="btn sm ghost" onclick="tourGo(1)">›</button></div>`;
  clearTimeout(TOUR_T);TOUR_T=setTimeout(()=>{if($('#tour')){TOUR_I=(TOUR_I+1)%TOUR.length;drawTour()}},7000)}
function tourGo(n){TOUR_I=(TOUR_I+n+TOUR.length)%TOUR.length;drawTour()}

(async()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(KEY+'-pending-')).forEach(k=>localStorage.removeItem(k));const db=await IDB.open();const t=db.transaction('kv','readwrite');const st=t.objectStore('kv');const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(!c)return;if(String(c.key).startsWith('blob:'))c.delete();c.continue()}}catch(e){}})();
