<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muninn — Document Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" defer></script>
<style>
:root{--p:#1F4E79;--s:#13304A;--a:#4A90C2;--t:#EEF4FA;--ink:#1d2329;--mut:#66707a;--line:#dfe3e8;--bg:#f6f7f9;--card:#fff;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
header.app{position:sticky;top:0;z-index:20;background:var(--s);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
header.app .brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px;white-space:nowrap}
header.app .brand img{height:28px;max-width:90px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.tabs a{color:#ffffffb8;text-decoration:none;padding:8px 12px;border-radius:7px;font-weight:500;white-space:nowrap}
nav.tabs a.on{background:#ffffff22;color:#fff}
nav.tabs a.off{opacity:.4;pointer-events:none}
nav.tabs a .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ffffff30;font-size:11px;margin-right:6px}
main{max-width:1440px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3a434c}
label.f small{font-weight:400;color:var(--mut)}
input,select,textarea{font:inherit;border:1px solid #cdd3da;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px;border-color:transparent}
.btn{font:inherit;font-weight:600;border:1px solid #cdd3da;background:#fff;color:var(--ink);padding:8px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#b42318}
.btn.danger.arm{background:#b42318;color:#fff;border-color:#b42318}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.themes{grid-template-columns:1fr}}
.fam h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 8px}
.sw{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;margin-bottom:8px;background:#fff}
.sw.on{border-color:var(--ink)}
.sw .chips{display:flex}
.sw .chips i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px}
.sw .chips i:first-child{margin-left:0}
.sw b{display:block}.sw span{font-size:12px;color:var(--mut)}
.logo-drop{display:flex;align-items:center;gap:12px}
.logo-drop .lp{width:120px;height:60px;border:1px dashed #b9c1ca;border-radius:8px;display:grid;place-items:center;color:var(--mut);font-size:11px;background:#fafbfc;overflow:hidden}
.logo-drop .lp img{max-width:100%;max-height:100%}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.tpl{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;overflow:hidden}
.tcard .band{background:var(--t);border-bottom:3px solid var(--p);padding:14px 16px}
.tcard .band .k{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--p)}
.tcard .band h3{margin:4px 0 0;font-size:16px}
.tcard .body{padding:14px 16px;flex:1;color:#3a434c}
.tcard .body ol{margin:6px 0 0;padding-left:18px}
.tcard .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#eef0f3;color:#3a434c}
.pill.Draft{background:#fff4e5;color:#9a5b00}.pill.In-Review{background:#e8f1ff;color:#1d4ed8}.pill.Approved{background:#e7f6ec;color:#17733a}.pill.Retired{background:#eee;color:#666}
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th,table.list td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mut)}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media(max-width:1100px){.ed{grid-template-columns:1fr}}
.ed .pv{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:#e9ecef;padding:18px}
.sec{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:14px}
.sec>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfd;border-radius:var(--r) var(--r) 0 0}
.sec>.hd .tag{font-size:11px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--p);padding:3px 8px;border-radius:5px}
.sec>.hd b{font-size:14px}
.sec>.bd{padding:14px 16px;display:grid;gap:12px}
.ftbl{width:100%;border-collapse:collapse}
.ftbl td{padding:3px}
.ftbl th{font-size:11px;text-align:left;color:var(--mut);padding:3px;font-weight:600}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;background:#fcfcfd}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.step .ctl{display:flex;flex-direction:column;gap:3px}
.meter{height:6px;border-radius:4px;background:#e4e7eb;overflow:hidden;width:140px}
.meter i{display:block;height:100%;background:var(--p)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0002;padding:6px;min-width:200px;display:none;z-index:30}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
.menu .dd button:hover{background:var(--bg)}
.menu .dd small{color:var(--mut);display:block;font-size:11px}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px;max-height:90vh;display:flex;flex-direction:column;gap:12px}
.modal textarea{flex:1;min-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--mut)}
.help{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}@media(max-width:900px){.help{grid-template-columns:1fr}}
.hnav{position:sticky;top:72px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 8px}.hnav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}.hnav a:hover{background:var(--bg)}.hnav a.on{background:var(--t);color:var(--s);font-weight:600}
.hbody{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 32px;max-width:960px;font-size:14.5px;line-height:1.6}.hbody h1{font-size:24px;margin-bottom:12px}.hbody h3{margin:22px 0 8px;font-size:16px;color:var(--s)}.hbody .lead{font-size:16px}
.hbody ul.hl li,.hbody ol.hsteps>li{margin-bottom:8px}.hbody ol.hsteps{padding-left:22px}.hbody table.list{margin:8px 0 14px;border:1px solid var(--line);border-radius:8px}.hbody table.list td{vertical-align:top}
.hfig{margin:12px 0 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f3f4f6}.hfig img{display:block;width:100%}.hfig figcaption{font-size:12px;color:var(--mut);padding:8px 12px;background:#fff;border-top:1px solid var(--line)}
.hdia{width:100%;height:auto;margin:12px 0 18px;border:1px solid var(--line);border-radius:10px;background:#fff}
.hpn{display:flex;gap:8px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}.hpn a{text-decoration:none}
.tour{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}.tslide{position:relative;border-radius:8px;overflow:hidden;background:#fff;min-height:120px}.tslide img{display:block;width:100%}
.tcap{position:absolute;left:12px;right:12px;bottom:12px;background:#1d2329e6;color:#fff;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}.tcap b{font-size:15px}
.tdot{width:8px;height:8px;border-radius:50%;background:#c4cad1;display:inline-block;cursor:pointer}.tdot.on{background:var(--p)}
.updbar{display:flex;gap:10px;align-items:center;background:#fff8e6;border-bottom:1px solid #f0d58a;padding:8px 20px;font-size:13px}
.appfoot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);align-items:baseline}.appfoot a{color:var(--mut)}
#exModal .box{max-width:1040px;height:min(720px,92vh)}
.exw{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;flex:1;min-height:0}.exw>div{min-height:0;display:flex;flex-direction:column}
.exsrc{border-right:1px solid var(--line);padding-right:10px;overflow:auto}
.exroster{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.exr{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.exrn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exlist{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px}
.exi{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:400}.exi:hover{background:var(--bg)}.exi.dis{opacity:.5;cursor:default}
.crumbs{font-size:13px}.crumbs a{color:var(--p);text-decoration:none}
.doc .wl{color:var(--p);border-bottom:1px dotted var(--p)}.doc a{color:var(--p)}
.simgrow{gap:8px;align-items:flex-start}.sthumb{border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff;display:flex;flex-direction:column;gap:4px;width:150px}.sthumb img{width:100%;height:84px;object-fit:contain;background:#f3f4f6;border-radius:4px}.sthumb .row{gap:4px;flex-wrap:nowrap}.sthumb input{padding:4px 6px;font-size:11.5px}
.step.drop{outline:2px dashed var(--a)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:4px;vertical-align:middle}
#wiModal .box{max-width:1180px;overflow:auto}
.wimap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}@media(max-width:900px){.wimap{grid-template-columns:1fr}}
.wic{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}.wic.ign{opacity:.5}
.wib{font-size:12.5px;color:#3a434c;max-height:180px;overflow:auto;margin-top:6px;padding:6px 8px;background:#fafbfc;border-radius:6px;user-select:text}.wib p{margin:0 0 6px}.wib table{border-collapse:collapse}.wib td,.wib th{border:1px solid var(--line);padding:3px 6px}
.wiside{position:sticky;top:0;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfcfd}
.selpop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0003;padding:8px;display:flex;gap:6px;align-items:center}.selpop select{width:auto}
.prtl{max-height:260px;overflow:auto;margin-top:8px;border-top:1px solid var(--line)}.prti{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.prti div{margin-top:3px}
#repoPanel .tag{font-size:11px;font-weight:800;letter-spacing:1px;color:#fff;padding:3px 8px;border-radius:5px}
#sync{cursor:pointer;border:1px solid #ffffff33;border-radius:7px;padding:5px 9px}#sync:hover{background:#ffffff1a}
#aiModal .box{max-width:860px;overflow:auto}
.aiprop{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.aiprop>label{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fbfcfd;border-bottom:1px solid var(--line);cursor:pointer}
.aiprop>label input{width:auto}
.doc.mini{padding:10px 14px;box-shadow:none;max-width:none;font-size:12px}
.seg{display:inline-flex;border:1px solid #cdd3da;border-radius:7px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 12px;font:inherit;cursor:pointer;border-right:1px solid #cdd3da}.seg button:last-child{border-right:0}.seg button.on{background:var(--p);color:#fff}
.aiset{background:var(--bg);border-radius:8px;padding:12px;display:grid;gap:10px}
.lib{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}@media(max-width:900px){.lib{grid-template-columns:1fr}}
.tree{padding:8px}.tn{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}.tn:hover{background:var(--bg)}.tn.on{background:var(--t);color:var(--s);font-weight:600}.tn.sub{padding-left:26px}
.callout{background:var(--t);border-left:4px solid var(--p);padding:12px 14px;border-radius:6px;margin-bottom:16px}
/* ===== document (preview + export share this) ===== */
.doc{background:#fff;max-width:816px;margin:0 auto;padding:44px 52px;box-shadow:0 2px 12px #0001;color:#1d2329;font-family:Inter,Calibri,Arial,sans-serif;font-size:13px;line-height:1.5}
.doc .dh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:12px;border-bottom:4px solid var(--p)}
.doc .dh .co{display:flex;align-items:center;gap:12px}
.doc .dh .co img{max-height:46px;max-width:140px}
.doc .dh .co b{font-size:15px;color:var(--s);display:block}
.doc .dh .co span{font-size:11px;color:#66707a}
.doc .dh .ty{text-align:right}
.doc .dh .ty .k{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--p)}
.doc .dh .ty .cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#fff;background:var(--s);padding:2px 7px;border-radius:3px;display:inline-block;margin-top:4px}
.doc h1.dt{font-size:22px;margin:18px 0 10px;color:var(--s)}
.doc table.meta{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
.doc table.meta td{border:1px solid #d6dbe1;padding:6px 8px;vertical-align:top}
.doc table.meta td.l{background:var(--t);font-weight:700;color:var(--s);width:16%;white-space:nowrap}
.doc h2.sh{font-size:15px;color:#fff;background:var(--p);padding:6px 10px;margin:22px 0 10px;border-radius:3px;display:flex;gap:10px;align-items:baseline}
.doc h2.sh .g{font-size:11px;font-weight:800;letter-spacing:1.4px;opacity:.85}
.doc h3{font-size:13px;color:var(--s);margin:12px 0 4px;border-bottom:1px solid #e3e7eb;padding-bottom:2px}
.doc p{margin:0 0 8px}
.doc ul{margin:0 0 8px;padding-left:20px}
.doc table.dtb{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 10px}
.doc table.dtb th{background:var(--s);color:#fff;text-align:left;padding:6px 8px;font-weight:600}
.doc table.dtb td{border:1px solid #d6dbe1;padding:6px 8px;vertical-align:top}
.doc table.dtb tr:nth-child(even) td{background:#fafbfc}
.doc ol.steps{list-style:none;counter-reset:s;padding:0;margin:4px 0 10px}
.doc ol.steps>li{counter-increment:s;position:relative;padding:0 0 10px 38px;margin-bottom:6px;border-bottom:1px dashed #e3e7eb}
.doc ol.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.doc ol.steps b{display:block}
.doc .simg{margin:6px 0}.doc .simg img{max-width:100%;max-height:420px;border:1px solid #d6dbe1;border-radius:4px;display:block}.doc .simg .cap{font-size:11px;color:#66707a;margin-top:2px}
.doc .caution{background:#fff6e5;border-left:4px solid var(--a);padding:6px 10px;margin-top:6px;font-size:12px}
.doc .ph{color:#8a939c;font-style:italic}
.doc .chg{margin-top:26px;border:1px solid #d6dbe1;border-top:3px solid var(--a);background:#fafbfc;padding:8px 10px;font-size:10.5px;color:#3a434c}
.doc .chg .k{font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--s);font-size:10px;margin-bottom:4px}
.doc .chg table{width:100%;border-collapse:collapse}.doc .chg td{padding:2px 6px 2px 0;vertical-align:top}.doc .chg td:first-child{width:56px}.doc .chg td:nth-child(2){width:84px;color:#66707a}
.doc .df{margin-top:28px;padding-top:8px;border-top:1px solid #d6dbe1;font-size:10px;color:#66707a;display:flex;justify-content:space-between;gap:10px}
@media print{.doc{box-shadow:none;padding:0;max-width:none}}
</style>
</head>
<body>
<header class="app">
  <div class="brand" id="appBrand">Muninn</div>
  <nav class="tabs" id="tabs">
    <a href="#setup" data-v="setup"><span class="n">1</span>Company &amp; Brand</a>
    <a href="#templates" data-v="templates"><span class="n">2</span>Templates</a>
    <a href="#drafts" data-v="drafts"><span class="n">3</span>Library</a>
    <a href="#editor" data-v="editor" id="tabEditor" style="display:none">Editor</a>
    <a href="#help" data-v="help" style="margin-left:auto">? Help</a>
  </nav>
  <span id="sync" class="hint" style="color:#ffffffd0;white-space:nowrap" onclick="go('connect')" title="Connection"></span>
</header>
<div id="updBar" class="updbar" style="display:none"></div>
<main id="view"></main>
<div id="appFoot" style="max-width:1440px;margin:0 auto;padding:0 20px 30px"></div>

<div class="modal" id="modal"><div class="box">
  <div class="row"><b id="mTitle">Export</b><span class="spacer"></span><button class="btn sm" onclick="closeModal()">Close</button></div>
  <div class="hint" id="mHint"></div>
  <textarea id="mText" readonly></textarea>
  <div class="row"><span class="spacer"></span><button class="btn pri" onclick="copyModal()">Copy to clipboard</button></div>
</div></div>
<div class="modal" id="cModal"><div class="box" style="max-width:520px"><b>Edit conflict</b><div class="msg"></div><div class="hint">Load theirs discards your unsaved changes to this document. Keep mine overwrites the folder copy.</div><div class="row"><span class="spacer"></span><button class="btn theirs">Load theirs</button><button class="btn pri mine">Keep mine</button></div></div></div>
<div class="modal" id="aiModal"><div class="box" id="aiBox"></div></div>
<div class="modal" id="exModal"><div class="box" id="exBox"></div></div>
<div class="modal" id="wiModal"><div class="box" id="wiBox"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script id="app">
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* ================= THEMES ================= */
const THEMES = [
  {id:'ember',   fam:'Warm',    name:'Ember',    note:'Terracotta & gold',   p:'#B5482A', s:'#6E2A18', a:'#E8A33D', t:'#FBF1EC'},

/* ================= SCHEMAS ================= */

  {key:'revisions', kind:'table', label:'Revisions', cols:['Version','Date','Author','Change Summary'], placeholder:['0.1','YYYY-MM-DD','Name','Initial draft']}

    blurb:'Repeatable process documentation structured Why → Who → What → How.',
    sections:[

      ]},

        {key:'verification', kind:'text', label:'Verification', placeholder:'How the performer confirms the procedure succeeded.'},

      ]},
      {key:'ref', tag:'REF', heading:'References', fields:[

      ]},

        {key:'keywords', kind:'text', label:'Keywords', placeholder:'Search terms, error codes, comma-separated.'},
      ]},
      REV
    ]},
  kbahow:{label:'KBA — How-To', short:'KBA', typeCode:'KBA',
    blurb:'Task-focused article showing a user how to accomplish one thing.',
    sections:[
      {key:'ov', tag:'OVERVIEW', heading:'Summary', fields:[
        {key:'summary', kind:'text', label:'Summary', placeholder:'What this article helps the reader do, in one sentence.'},
        {key:'appliesTo', kind:'list', label:'Applies To', placeholder:'Products, versions, or systems (one per line).'},
        {key:'audience', kind:'text', label:'Audience', placeholder:'Who should follow this article.'},
      ]},

const STATUSES = ['Draft','In Review','Approved','Retired'];
const CLASSES = ['Public','Internal Use','Confidential','Restricted'];

/* ================= STATE ================= */
const KEY = 'sopkba-templater-v1';
let S = {profile:null, drafts:[], current:null};
function defaultProfile(){return {name:'',code:'',tagline:'',website:'',phone:'',address:'',logo:'',theme:'',owner:'',approver:'',classification:'Internal Use',reviewMonths:12,parts:[{k:'CODE',on:true},{k:'TYPE',on:true},{k:'DEPT',on:true},{k:'NUM',on:true},{k:'VER',on:false}],sep:'-',numPad:3,departments:'IT, OPS, HR, FIN, SALES'}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){S.profile=Object.assign(defaultProfile(),j.profile||{});S.drafts=j.drafts||[];S.current=j.current||null}}catch(e){}if(!S.profile)S.profile=defaultProfile()}
let saveT,BROWSER_DRAFTS=null;function save(){if(typeof DEMO!=='undefined'&&DEMO)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({profile:S.profile,drafts:external()?BROWSER_DRAFTS:S.drafts,current:S.current}))}catch(e){}},250);if(DIR)queueFlush();if(REPO)savePending()}
const setupDone=()=>!!S.profile.name.trim();
const PARTS={CODE:'Company code',TYPE:'Doc type (SOP/KBA)',DEPT:'Department',NUM:'Sequence #',VER:'Version'};
function coCode(){const p=S.profile;if(p.code.trim())return p.code.toUpperCase();const w=p.name.replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(x=>x&&!/^(llc|inc|co|corp|ltd|the|and|of)$/i.test(x));return w.length>1?w.map(x=>x[0]).join('').slice(0,4).toUpperCase():(w[0]||'CODE').slice(0,6).toUpperCase()}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pad=(n,w=3)=>String(n||'').padStart(w,'0');
const slug=s=>String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'untitled';
const depts=()=>S.profile.departments.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function addMonths(d,m){if(!d)return'';const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+(+m||12));return x.toISOString().slice(0,10)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function applyTheme(){const t=themeOf(S.profile.theme);const r=document.documentElement.style;r.setProperty('--p',t.p);r.setProperty('--s',t.s);r.setProperty('--a',t.a);r.setProperty('--t',t.t);
  $('#appBrand').innerHTML=(S.profile.logo?`<img src="${S.profile.logo}" alt="">`:'')+'<span>Muninn</span>'+(S.profile.name?`<span style="opacity:.65;font-weight:500">· ${esc(S.profile.name)}</span>`:'')}

function docId(d,base){const p=S.profile,sc=SCHEMAS[d.type];const parts=(p.parts&&p.parts.length?p.parts:defaultProfile().parts).filter(x=>x.on);
  const val={CODE:coCode(),TYPE:sc.typeCode,DEPT:base?'DEPT':(d.h.dept||'DEPT'),NUM:base?'#'.repeat(+p.numPad||3):pad(d.h.num,+p.numPad||3),VER:'v'+(base?'X.Y':d.h.version)};
  return parts.map(x=>val[x.k]).filter(Boolean).join(p.sep??'-')||sc.typeCode}
function fileBase(d,base){return base?`${coCode()}_${SCHEMAS[d.type].short}_${d.type==='sop'?'Template':SCHEMAS[d.type].label.split('— ')[1].replace(/\W/g,'')+'-Template'}`:`${docId(d)}_${slug(d.h.title)}_v${d.h.version}`}

function newDoc(type){const p=S.profile;const nums=S.drafts.filter(x=>SCHEMAS[x.type].typeCode===SCHEMAS[type].typeCode).map(x=>+x.h.num||0);
  const d={id:uid(),type,updated:Date.now(),h:{title:'',dept:depts()[0]||'',num:String((Math.max(0,...nums))+1),version:'0.1',status:'Draft',owner:p.owner,approver:p.approver,effective:'',review:'',classification:p.classification},f:{}};
  SCHEMAS[type].sections.forEach(s=>s.fields.forEach(f=>{d.f[f.key]=f.kind==='table'?[]:f.kind==='steps'?[]:''}));
  d.f.revisions=[['0.1',today(),p.owner||'','Initial draft']];
  d.f.steps=[{action:'',detail:'',caution:''}];
  return d}

/* ================= DOCUMENT RENDER (HTML) ================= */
function ph(t){return `<span class="ph">[${esc(t)}]</span>`}
function paras(s){return String(s).split(/\n\s*\n/).map(p=>`<p>${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('')}
function renderField(f,v,base){
  const empty = f.kind==='table'?!(v&&v.length):f.kind==='steps'?!(v&&v.some(s=>s.action||s.detail||(s.images&&s.images.length))):!String(v||'').trim();
  const useBase = base||empty;
  if(f.kind==='text') return useBase?`<p>${ph(f.placeholder)}</p>`:paras(v);
  if(f.kind==='list') return useBase?`<ul><li>${ph(f.placeholder)}</li><li>${ph('…')}</li></ul>`:`<ul>${lines(v).map(x=>`<li>${inlineLinks(x)}</li>`).join('')}</ul>`;
  if(f.kind==='table'){const rows=useBase?[f.placeholder.map(x=>ph(x)),f.cols.map(()=>'&nbsp;')]:v.map(r=>f.cols.map((_,i)=>esc(r[i]||'')));
    return `<table class="dtb"><thead><tr>${f.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  if(f.kind==='steps'){const st=useBase?[1,2,3].map(i=>({action:ph(f.placeholder.action),detail:ph(f.placeholder.detail),caution:i===2?ph('Caution / warning (optional)'):''})):v.filter(s=>(s.action||s.detail||s.caution||(s.images&&s.images.length))).map(s=>({action:esc(s.action),detail:esc(s.detail).replace(/\n/g,'<br>'),caution:esc(s.caution),imgs:s.images||[]}));
    return `<ol class="steps">${st.map(s=>`<li><b>${s.action}</b>${s.detail?`<div>${s.detail}</div>`:''}${(s.imgs||[]).map(im=>`<div class="simg">${im.data?`<img src="${im.data}" alt="${esc(im.alt||'')}">`:`<span class="ph">[image: ${esc(im.alt||im.name||im.path||'')}]</span>`}${im.alt?`<div class="cap">${esc(im.alt)}</div>`:''}</div>`).join('')}${s.caution?`<div class="caution"><b style="display:inline">⚠ Caution:</b> ${s.caution}</div>`:''}</li>`).join('')}</ol>`}
}
function metaRows(d,base){const h=d.h,P=x=>base?'':x;
  const rev=base?'':(h.review||addMonths(h.effective,S.profile.reviewMonths));
  return [['Document ID',base?docId(d,true):docId(d),'Version',base?'X.Y':h.version],
          ['Owner',P([h.owner,h.ownerRole].filter(Boolean).join(' — ')),'Status',base?'Draft / In Review / Approved':h.status],
          ['Approver',P(h.approver),'Department',base?'':h.dept],
          ['Effective Date',P(h.effective),'Next Review',rev]]}
function vnum(v){const [M,m]=String(v||'0').split('.').map(x=>+x||0);return M*1000+m}
function changeNote(d,base){if(base)return {since:'X.0',rows:[['X.Y','YYYY-MM-DD','[Summary of change since last major version]']]};
  const cur=vnum(d.h.version),M=Math.floor(cur/1000),baseM=(cur%1000===0&&M>0)?M-1:M;
  const rows=(d.f.revisions||[]).filter(r=>{const v=vnum(r[0]);return v>baseM*1000&&v<=cur}).map(r=>[r[0],r[1],r[3]||'—']);
  return {since:baseM+'.0',rows}}
function renderChange(d,base){const c=changeNote(d,base);return `<div class="chg"><div class="k">Changes since v${c.since}</div>${c.rows.length?`<table><tbody>${c.rows.map(r=>`<tr><td class="mono">v${esc(r[0])}</td><td>${esc(r[1])}</td><td>${base?`<span class="ph">${esc(r[2])}</span>`:esc(r[2])}</td></tr>`).join('')}</tbody></table>`:'<div>No changes recorded since this major version.</div>'}</div>`}
function renderDoc(d,base){const p=S.profile,sc=SCHEMAS[d.type];
  const title=base?`${sc.label} Title`:(d.h.title||'Untitled '+sc.short);
  let n=0;
  const secs=sc.sections.map(s=>{n++;return `<h2 class="sh"><span class="g">${s.tag}</span><span>${s===REV?'':n+'. '}${esc(s.heading)}</span></h2>`+
    s.fields.map(f=>(s.fields.length>1?`<h3>${esc(f.label)}</h3>`:'')+renderField(f,d.f[f.key],base)).join('')}).join('');
  return `<div class="doc">
  <div class="dh"><div class="co">${p.logo?`<img src="${p.logo}" alt="">`:''}<div><b>${esc(p.name||'Company Name')}</b><span>${esc([p.tagline,p.website,p.phone].filter(Boolean).join(' · '))}</span></div></div>
  <div class="ty"><div class="k">${esc(sc.label.toUpperCase())}</div><div class="cl">${esc(base?(p.classification||'Internal Use'):d.h.classification)}</div></div></div>
  <h1 class="dt">${base?ph(title):esc(title)}</h1>
  <table class="meta">${metaRows(d,base).map(r=>`<tr><td class="l">${r[0]}</td><td>${esc(r[1])||'&nbsp;'}</td><td class="l">${r[2]}</td><td>${esc(r[3])||'&nbsp;'}</td></tr>`).join('')}</table>
  ${secs}
  ${!base&&d.other&&d.other.trim()?`<h2 class="sh"><span class="g">MORE</span><span>Other sections</span></h2>${paras(d.other)}`:''}
  ${renderChange(d,base)}
  <div class="df"><span>${esc(p.name)} · ${esc(base?docId(d,true):docId(d))} · v${esc(base?'X.Y':d.h.version)}</span><span>Controlled document — printed copies are uncontrolled. Verify current version before use.</span></div>
  </div>`}

function docCSS(){const t=themeOf(S.profile.theme);
  const sh=[...document.styleSheets].find(s=>s.ownerNode&&s.ownerNode.tagName==='STYLE');
  const css=[...(sh?sh.cssRules:[])].map(r=>r.cssText).filter(c=>c.startsWith('.doc')||c.startsWith('@media print')).join('\n');
  return `:root{--p:${t.p};--s:${t.s};--a:${t.a};--t:${t.t}}body{margin:0;background:#e9ecef;padding:24px}@media print{body{background:#fff;padding:0}}\n${css}`}
function htmlExport(d,base){return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(base?fileBase(d,true):docId(d)+' '+d.h.title)}</title><style>${docCSS()}</style></head><body>${renderDoc(d,base)}</body></html>`}

/* ================= MARKDOWN ================= */
function mdField(f,v,base){const empty=f.kind==='table'?!(v&&v.length):f.kind==='steps'?!(v&&v.some(s=>s.action||s.detail)):!String(v||'').trim();const B=base||empty,P=t=>`_[${t}]_`;
  const cell=x=>String(x||'').replace(/\|/g,'\\|').replace(/\n/g,' ');
  if(f.kind==='text')return (B?P(f.placeholder):String(v).trim())+'\n';
  if(f.kind==='list')return B?`- ${P(f.placeholder)}\n- \n`:lines(v).map(x=>'- '+x).join('\n')+'\n';
  if(f.kind==='table'){const rows=B?[f.placeholder.map(P),f.cols.map(()=>' ')]:v.map(r=>f.cols.map((_,i)=>cell(r[i])));return `| ${f.cols.join(' | ')} |\n|${f.cols.map(()=>'---').join('|')}|\n`+rows.map(r=>`| ${r.join(' | ')} |`).join('\n')+'\n'}
  if(f.kind==='steps'){const st=B?[1,2,3].map(()=>({action:P(f.placeholder.action),detail:P(f.placeholder.detail),caution:''})):v.filter(s=>(s.action||s.detail||s.caution||(s.images&&s.images.length)));
    return st.map((s,i)=>`${i+1}. **${s.action}**${s.detail?`  \n   ${String(s.detail).replace(/\n/g,'  \n   ')}`:''}${(s.images||[]).map(im=>`  \n   ![${im.alt||''}](${im.data||im.path})`).join('')}${s.caution?`  \n   > ⚠ **Caution:** ${s.caution}`:''}`).join('\n')+'\n'}
}
function mdExport(d,base){const p=S.profile,sc=SCHEMAS[d.type];let o=`**${p.name||'Company Name'}** — ${sc.label}  \n_${base?(p.classification):d.h.classification}_\n\n# ${base?`[${sc.label} Title]`:(d.h.title||'Untitled')}\n\n`;
  o+='| | | | |\n|---|---|---|---|\n'+metaRows(d,base).map(r=>`| **${r[0]}** | ${r[1]||' '} | **${r[2]}** | ${r[3]||' '} |`).join('\n')+'\n\n';
  let n=0;sc.sections.forEach(s=>{n++;o+=`## ${s===REV?'':n+'. '}${s.tag} — ${s.heading}\n\n`;s.fields.forEach(f=>{if(s.fields.length>1)o+=`### ${f.label}\n\n`;o+=mdField(f,d.f[f.key],base)+'\n'})});
  if(!base&&d.other&&d.other.trim())o+=d.other.trim()+'\n\n';
  {const c=changeNote(d,base);o+=`---\n<sub>**Changes since v${c.since}:** `+(c.rows.length?c.rows.map(r=>`v${r[0]} (${r[1]}) ${r[2]}`).join('; '):'none recorded')+`</sub>\n\n`}
  o+=`---\n_${p.name||'Company Name'} · ${base?docId(d,true):docId(d)} · v${base?'X.Y':d.h.version} — Controlled document; printed copies are uncontrolled._\n`;return o}

/* ================= DOCX ================= */
function dataUrlBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function docxExport(d,base){
  if(!window.docx)throw new Error('Word library not loaded yet');
  const X=window.docx,t=themeOf(S.profile.theme),p=S.profile,sc=SCHEMAS[d.type],H=c=>c.replace('#','');
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,ShadingType,AlignmentType,Header,Footer,PageNumber,ImageRun,BorderStyle}=X;
  const font='Calibri';
  const R=(text,o={})=>new TextRun({text:String(text??''),font,size:o.size||21,bold:o.bold,italics:o.italics,color:o.color});
  const PH=txt=>R(`[${txt}]`,{italics:true,color:'8A939C'});
  const para=(runs,o={})=>new Paragraph({children:Array.isArray(runs)?runs:[runs],spacing:{after:o.after??100},...o.p});
  const bd={style:BorderStyle.SINGLE,size:4,color:'D6DBE1'};const borders={top:bd,bottom:bd,left:bd,right:bd};
  const cell=(children,o={})=>new TableCell({children:Array.isArray(children)?children:[children],borders,shading:o.fill?{type:ShadingType.CLEAR,color:'auto',fill:o.fill}:undefined,width:o.w?{size:o.w,type:WidthType.PERCENTAGE}:undefined,margins:{top:60,bottom:60,left:100,right:100}});
  const out=[];
  // title + meta
  out.push(para(base?[PH(sc.label+' Title')]:[R(d.h.title||'Untitled',{size:36,bold:true,color:H(t.s)})],{after:160}));
  out.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:metaRows(d,base).map(r=>new TableRow({children:[
    cell(para(R(r[0],{bold:true,color:H(t.s),size:19}),{after:0}),{fill:H(t.t),w:18}),cell(para(R(r[1],{size:19}),{after:0}),{w:32}),
    cell(para(R(r[2],{bold:true,color:H(t.s),size:19}),{after:0}),{fill:H(t.t),w:18}),cell(para(R(r[3],{size:19}),{after:0}),{w:32})]}))}));
  let n=0;
  for(const s of sc.sections){n++;
    out.push(new Paragraph({spacing:{before:320,after:140},shading:{type:ShadingType.CLEAR,color:'auto',fill:H(t.p)},children:[R(' '+s.tag+'   ',{bold:true,color:'FFFFFF',size:18}),R((s===REV?'':n+'. ')+s.heading,{bold:true,color:'FFFFFF',size:26})]}));

      if(s.fields.length>1)out.push(new Paragraph({spacing:{before:160,after:60},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:'E3E7EB',space:1}},children:[R(f.label,{bold:true,color:H(t.s),size:22})]}));
      const empty=f.kind==='table'?!(v&&v.length):f.kind==='steps'?!(v&&v.some(x=>x.action||x.detail)):!String(v||'').trim();const B=base||empty;
      if(f.kind==='text'){if(B)out.push(para(PH(f.placeholder)));else String(v).split(/\n\s*\n/).forEach(pp=>out.push(para(pp.split('\n').map((l,i)=>new TextRun({text:l,font,size:21,break:i?1:0})))))}
      else if(f.kind==='list'){(B?[null,'']:lines(v)).forEach(x=>out.push(new Paragraph({bullet:{level:0},spacing:{after:40},children:[x===null?PH(f.placeholder):R(plainLinks(x))]})))}
      else if(f.kind==='table'){const rows=B?[f.placeholder.map(x=>[PH(x)]),f.cols.map(()=>[R('')])]:v.map(r=>f.cols.map((_,i)=>[R(r[i]||'')]));
        out.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({tableHeader:true,children:f.cols.map(c=>cell(para(R(c,{bold:true,color:'FFFFFF',size:19}),{after:0}),{fill:H(t.s)}))}),
          ...rows.map(r=>new TableRow({children:r.map(c=>cell(para(c.map?c:[c],{after:0})))}))]}));out.push(para(R(''),{after:60}))}
      else if(f.kind==='steps'){const st=B?[1,2,3].map(i=>({ph:1,c:i===2})):v.filter(x=>x.action||x.detail||x.caution||(x.images&&x.images.length));
        st.forEach((x,i)=>{out.push(new Paragraph({spacing:{before:100,after:30},children:[R(`${i+1}.  `,{bold:true,color:H(t.p),size:22}),x.ph?PH(f.placeholder.action):R(x.action,{bold:true,size:22})]}));
          if(x.ph||x.detail)out.push(new Paragraph({indent:{left:400},spacing:{after:40},children:x.ph?[PH(f.placeholder.detail)]:String(x.detail).split('\n').map((l,j)=>new TextRun({text:l,font,size:21,break:j?1:0}))}));
          (x.images||[]).filter(im=>im.data&&im.w).forEach(im=>{const sc2=Math.min(1,480/im.w,360/im.h);try{out.push(new Paragraph({indent:{left:400},spacing:{after:40},children:[new ImageRun({data:dataUrlBytes(im.data),transformation:{width:Math.round(im.w*sc2),height:Math.round(im.h*sc2)}})]}));if(im.alt)out.push(new Paragraph({indent:{left:400},spacing:{after:60},children:[R(im.alt,{italics:true,size:17,color:'66707A'})]}))}catch(e){}});
          if(x.c||x.caution)out.push(new Paragraph({indent:{left:400},spacing:{after:60},shading:{type:ShadingType.CLEAR,color:'auto',fill:'FFF6E5'},border:{left:{style:BorderStyle.SINGLE,size:18,color:H(t.a),space:6}},children:[R('⚠ Caution: ',{bold:true,size:19}),x.c?PH('Caution / warning (optional)'):R(x.caution,{size:19})]}))})}
    }}
  {const c=changeNote(d,base);out.push(new Paragraph({spacing:{before:400,after:60},border:{top:{style:BorderStyle.SINGLE,size:12,color:H(t.a),space:4}},children:[R('CHANGES SINCE V'+c.since,{bold:true,color:H(t.s),size:16})]}));
    (c.rows.length?c.rows:[['','','No changes recorded since this major version.']]).forEach(r=>out.push(new Paragraph({spacing:{after:20},children:[R(r[0]?'v'+r[0]+'   ':'',{bold:true,size:16}),R(r[1]?r[1]+'   ':'',{size:16,color:'66707A'}),base?R(r[2],{size:16,italics:true,color:'8A939C'}):R(r[2],{size:16})]})))}
  if(!base&&d.other&&d.other.trim()){out.push(new Paragraph({spacing:{before:320,after:140},shading:{type:ShadingType.CLEAR,color:'auto',fill:H(t.p)},children:[R(' MORE   ',{bold:true,color:'FFFFFF',size:18}),R('Other sections',{bold:true,color:'FFFFFF',size:26})]}));
    d.other.split('\n').forEach(l=>{const h=l.match(/^#{1,6}\s+(.*)/);out.push(new Paragraph({spacing:{after:60},children:[h?R(h[1],{bold:true,color:H(t.s),size:22}):R(l.replace(/^[-*]\s+/,'• '))]}))})}
  const hdrKids=[];
  if(p.logo){try{hdrKids.push(new ImageRun({data:dataUrlBytes(p.logo),transformation:{width:Math.round(36*(p.logoRatio||2.5)),height:36}}))}catch(e){}}
  hdrKids.push(R((p.logo?'   ':'')+(p.name||'Company Name'),{bold:true,color:H(t.s),size:22}));
  const header=new Header({children:[
    new Paragraph({children:hdrKids,spacing:{after:40}}),
    new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:24,color:H(t.p),space:4}},spacing:{after:120},children:[R(sc.label.toUpperCase(),{bold:true,color:H(t.p),size:16}),R('   |   '+(base?docId(d,true):docId(d))+'   |   v'+(base?'X.Y':d.h.version)+'   |   '+(base?p.classification:d.h.classification).toUpperCase(),{color:'66707A',size:16})]})]});
  const footer=new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({font,size:16,color:'66707A',children:['Controlled document — printed copies are uncontrolled.    Page ',PageNumber.CURRENT,' of ',PageNumber.TOTAL_PAGES]})]})]});
  const doc=new Document({creator:p.name,title:base?fileBase(d,true):d.h.title,styles:{default:{document:{run:{font,size:21}}}},
    sections:[{properties:{page:{margin:{top:1200,bottom:1000,left:1100,right:1100}}},headers:{default:header},footers:{default:footer},children:out}]});
  return await Packer.toBlob(doc)}

async function exportAs(fmt,d,base){
  try{if(d&&!base)await hydrateDoc(d);
    if(fmt==='json'){const txt=JSON.stringify({app:'sopkba-templater',v:1,profile:S.profile,drafts:S.drafts.map(x=>{const {_file,_mtime,...r}=x;return r})},null,1);
      if(!await offer(`${coCode()}_SOP-KBA_backup_${today()}.json`,txt))openModal('Backup (JSON)',txt,'Copy and save this as a .json file. Use “Import backup” to restore it.');return}
    const name=fileBase(d,base)+'.'+fmt;
    if(fmt==='docx')toast('Building Word document…');
    const data=fmt==='docx'?await docxExport(d,base):fmt==='md'?mdExport(d,base):htmlExport(d,base);
    if(DIR){const path=base?['Templates']:docFolder(d);await writeAt(path,name,data);toast('Saved to '+relPath(path,name));return}
    if(await offer(name,data))return;
    if(fmt==='docx'){toast('Word download isn’t available in this view — use Markdown or HTML');return}
    openModal(fmt==='md'?'Markdown':'HTML',data,`Downloads aren't available in this view — copy below and save as ${name}.${fmt==='html'?' Open it in a browser and print to PDF for a PDF copy.':''}`)
  }catch(e){toast('Export failed: '+e.message)}}

async function loadFromDir(){const docs=[];SNAP.clear();

  async function walk(dh,path,depth){if(depth>5)return;for await(const [n,h] of dh.entries()){
      if(h.kind==='directory'){if(n.startsWith('.')||n==='_Archive'||n==='_templater'||n==='node_modules')continue;await walk(h,[...path,n],depth+1);continue}

const aiFields=d=>SCHEMAS[d.type].sections.filter(x=>x!==REV).flatMap(x=>x.fields);
function aiShape(f){if(f.kind==='text')return `string — ${f.placeholder}`;if(f.kind==='list')return [`string — ${f.placeholder.replace(/ \(one per line\)\.?/,'')}`];
  if(f.kind==='table')return [Object.fromEntries(f.cols.map((c,i)=>[c,`string, e.g. ${f.placeholder[i]}`]))];
  return [{action:'string — imperative verb phrase',detail:'string — how / where / what done looks like',caution:'string — optional warning, else ""'}]}
function curVal(f,v){if(f.kind==='list')return lines(v);if(f.kind==='table')return (v||[]).map(r=>Object.fromEntries(f.cols.map((c,i)=>[c,r[i]||''])));if(f.kind==='steps')return (v||[]).filter(x=>x.action||x.detail);return v||''}
function buildPrompt(d,brief,notes,mode){const sc=SCHEMAS[d.type],p=S.profile;
  const shape={title:'string — concise document title',fields:Object.fromEntries(aiFields(d).map(f=>[f.key,aiShape(f)]))};
  const current={title:d.h.title||'',fields:Object.fromEntries(aiFields(d).map(f=>[f.key,curVal(f,d.f[f.key])]))};
  const guide=d.type==='sop'?'The SOP is structured Why → Who → What → How. WHY: purpose, scope, why it matters. WHO: audience and roles/responsibilities. WHAT: definitions, prerequisites, tools, outputs. HOW: numbered procedure steps, verification, exceptions and escalation.':`This is a knowledge base article (${sc.label}). Keep it short and scannable for a service desk technician or end user.`;
  const task=mode==='fill'?'Fill in ONLY the fields that are empty in CURRENT CONTENT. Return non-empty fields exactly as they are.':mode==='improve'?'Improve the clarity, completeness and consistency of CURRENT CONTENT. Keep every stated fact; fill gaps.':'Write the complete document from the brief and notes. Ignore CURRENT CONTENT except as hints.';
  return `You are drafting a ${sc.label} for ${p.name||'a small business'}${d.h.dept?` (${d.h.dept} department)`:''}.
${guide}

TASK: ${task}

BRIEF: ${brief||'(none — infer from the title and notes)'}
${notes?`\nSOURCE NOTES (authoritative facts; prefer these over assumptions):\n"""\n${notes.slice(0,60000)}\n"""\n`:''}
RULES:
- One action per step, each starting with a verb. Typically 5–15 steps.
- Never invent specific names, URLs, phone numbers, IP addresses, prices or settings. Where a specific is unknown, write a bracketed placeholder such as [TBD: approver name].
- Plain business English. No marketing tone, no emojis.
- List items are short strings without bullet characters or numbering.

CURRENT CONTENT:
${JSON.stringify(current,null,1)}

Reply with ONLY one JSON object in exactly this shape (the strings describe what belongs in each field):
${JSON.stringify(shape,null,1)}`}
function parseAI(text){let t=String(text||'').trim();const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)t=m[1];const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('The reply did not contain a JSON object.');return JSON.parse(t.slice(a,b+1))}
function unwrap(r){if(Array.isArray(r))r=r[0];if(r&&typeof r==='object'&&(r.fields||r.title))return r;if(r&&typeof r==='object'){const t=r.output??r.text??r.response??r.result??r.content;if(t&&typeof t==='object')return unwrap(t);if(typeof t==='string')return parseAI(t)}return parseAI(typeof r==='string'?r:JSON.stringify(r))}
function normalizeAI(d,j){const F=j.fields||j,out={};if(j.title&&typeof j.title==='string')out.title=j.title.trim();const S2=v=>v==null?'':typeof v==='string'?v:typeof v==='object'?Object.values(v).join(' — '):String(v);
  for(const f of aiFields(d)){let v=F[f.key];if(v==null)continue;
    if(f.kind==='text')v=Array.isArray(v)?v.map(S2).join('\n\n'):S2(v);
    else if(f.kind==='list')v=(Array.isArray(v)?v.map(S2):String(v).split('\n')).map(x=>x.replace(/^\s*([-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean).join('\n');
    else if(f.kind==='table')v=(Array.isArray(v)?v:[]).map(r=>Array.isArray(r)?f.cols.map((_,i)=>S2(r[i])):f.cols.map((c,i)=>{const k=Object.keys(r).find(k=>k.toLowerCase()===c.toLowerCase());return S2(k?r[k]:Object.values(r)[i])}));
    else v=(Array.isArray(v)?v:[]).map(x=>typeof x==='string'?{action:x,detail:'',caution:''}:{action:S2(x.action||x.step||x.title),detail:S2(x.detail||x.details||x.description),caution:S2(x.caution||x.warning||x.note)}).filter(x=>x.action||x.detail);
    out[f.key]=v}
  return out}
async function callAI(d,prompt,signal){const a=AIS,p=curProv(),sys='You write clear, accurate standard operating procedures and knowledge base articles for small and mid-sized businesses. You reply with JSON only.';
  if(p==='claude')return await SAMPLE.json(sys+'\n\n'+prompt,{signal,cache:false});
  const need=(...k)=>k.forEach(x=>{if(!String(a[x]||'').trim())throw new Error(`Set “${FL[x]}” in AI settings.`)});
  const J=async(url,opt)=>{let r;try{r=await fetch(url,{...opt,signal})}catch(e){if(e.name==='AbortError')throw e;let host=url;try{host=new URL(url).host}catch(x){}throw new Error(`Could not reach ${host}. Check the address, your network, and that it accepts browser (CORS) requests.`)}
    const t=await r.text();if(!r.ok)throw new Error(`${r.status} from provider: ${t.slice(0,300)}`);try{return JSON.parse(t)}catch(e){return t}};
  if(p==='openai'||p==='compat'||p==='azure'){let url;const h={'Content-Type':'application/json'};
    if(p==='openai'){need('key','model');url='https://api.openai.com/v1/chat/completions';h.Authorization='Bearer '+a.key.trim()}
    if(p==='compat'){need('baseUrl','model');url=a.baseUrl.trim().replace(/\/+$/,'')+'/chat/completions';if(a.key)h.Authorization='Bearer '+a.key.trim()}
    if(p==='azure'){need('endpoint','deployment','key');url=`${a.endpoint.trim().replace(/\/+$/,'')}/openai/deployments/${encodeURIComponent(a.deployment.trim())}/chat/completions?api-version=${encodeURIComponent(a.apiVersion||'2024-10-21')}`;h['api-key']=a.key.trim()}
    const body={messages:[{role:'system',content:sys},{role:'user',content:prompt}]};if(p!=='azure')body.model=a.model.trim();if(p!=='compat')body.response_format={type:'json_object'};
    const r=await J(url,{method:'POST',headers:h,body:JSON.stringify(body)});return r&&r.choices?r.choices[0].message.content:r}
  if(p==='anthropic'){need('key','model');const r=await J('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':a.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:a.model.trim(),max_tokens:8000,system:sys,messages:[{role:'user',content:prompt}]})});return (r.content||[]).map(c=>c.text||'').join('')}
  if(p==='gemini'){need('key','model');const r=await J(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model.trim())}:generateContent?key=${encodeURIComponent(a.key.trim())}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});return ((r.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
  if(p==='webhook'){need('url');const h={'Content-Type':'application/json'};if(a.hName)h[a.hName.trim()]=a.hVal||'';return await J(a.url.trim(),{method:'POST',headers:h,body:JSON.stringify({system:sys,prompt,docType:d.type,docLabel:SCHEMAS[d.type].label,company:S.profile.name})})}
  throw new Error('Use Copy prompt for this provider.')}

async function copyPrompt(){const d=curDoc();const t=buildPrompt(d,AIST.brief,AIST.notes,AIST.mode);try{await navigator.clipboard.writeText(t);toast('Prompt copied — paste it into your AI')}catch(e){openModal('AI prompt',t,'Copy this prompt into any AI chat, then paste its reply back into AI assist.')}}

  catch(e){const c=e&&e.code;if(c==='cancelled'||(e&&e.name==='AbortError')){st.textContent='Stopped.'}else if(c==='not_granted'||c==='sampling_disabled'){st.textContent='Claude isn’t allowed here. Switch to “Any AI — copy & paste” in ⚙ Change.'}else if(c==='rate_limited'){st.textContent='Rate limited — wait a moment and try again.'}else if(c==='invalid_json'){st.textContent='The reply wasn’t valid JSON — try again or use Write from scratch.'}else st.textContent='⚠ '+(e&&e.message||c||e)}
  finally{if($('#aiGo')){$('#aiGo').disabled=false;$('#aiStop').style.display='none'}AIST.ctl=null}}
function setProps(d,j){const n=normalizeAI(d,j);if(!Object.keys(n).length){toast('The reply had no fields matching this template');return}AIST.props=n;drawReview()}
function isEmpty(f,v){return f.kind==='table'?!(v&&v.length):f.kind==='steps'?!(v&&v.some(s=>s.action||s.detail)):!String(v||'').trim()}

const FM_KNOWN={uid:d=>d.id,type:d=>d.type,id:d=>docId(d),title:d=>d.h.title,department:d=>d.h.dept,number:d=>d.h.num,version:d=>d.h.version,status:d=>d.h.status,

const FM_TO_H={title:'title',department:'dept',number:'num',version:'version',status:'status',owner:'owner',owner_role:'ownerRole',approver:'approver',effective:'effective',review:'review',classification:'classification'};
function yq(s){s=String(s);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(s===''||/^\s|\s$|^[-?:,\[\]{}#&*!|>'"%@`]|: | #|\n|^(true|false|yes|no|null|~)$|^[+-]?\d+(\.\d+)?$/i.test(s))return JSON.stringify(s);return s}
function yamlLine(k,v){if(Array.isArray(v))return v.length?`${k}:\n`+v.map(x=>`  - ${yq(x)}`).join('\n'):`${k}: []`;
  if(v===''||v==null)return `${k}:`;if(typeof v==='boolean'||typeof v==='number')return `${k}: ${v}`;return `${k}: ${yq(v)}`}
function yscalar(s){s=String(s).trim();if(/^".*"$/.test(s)){try{return JSON.parse(s)}catch(e){return s.slice(1,-1)}}
  if(/^'.*'$/.test(s))return s.slice(1,-1).replace(/''/g,"'");s=s.replace(/\s+#.*$/,'');
  if(/^(true|false)$/i.test(s))return s.toLowerCase()==='true';if(/^[+-]?\d+(\.\d+)?$/.test(s))return Number(s);if(s==='~'||s==='null')return '';return s}
function yraw(s){s=String(s).trim();if(/^".*"$/.test(s)){try{return JSON.parse(s)}catch(e){}}if(/^'.*'$/.test(s))return s.slice(1,-1).replace(/''/g,"'");return s.replace(/\s+#.*$/,'')}
function parseFM(text){text=String(text).replace(/^﻿/,'');const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/);if(!m)return {fm:null,body:text};
  const fm=[];let cur=null;
  for(const ln of m[1].split(/\r?\n/)){const km=!/^\s/.test(ln)&&ln.match(/^([^:#\s][^:]*):(?:\s+(.*)|\s*)$/);
    if(km){cur={k:km[1].trim(),s:(km[2]||'').trim(),lines:[ln]};fm.push(cur)}else if(cur)cur.lines.push(ln)}
  fm.forEach(e=>{e.raw=e.lines.join('\n');const cont=e.lines.slice(1).filter(l=>l.trim());delete e.lines;
    if(e.s===''&&cont.length&&cont.every(l=>/^\s*-\s/.test(l)||/^\s*-$/.test(l)))e.v=cont.map(l=>yscalar(l.replace(/^\s*-\s?/,'')));
    else if(/^[|>][-+]?$/.test(e.s))e.v=cont.map(l=>l.replace(/^\s{2}/,'')).join(e.s[0]==='|'?'\n':' ');
    else if(/^\[.*\]$/.test(e.s))e.v=e.s.slice(1,-1).split(',').map(x=>yscalar(x)).filter(x=>x!=='');
    else e.v=yscalar(e.s);
    e.str=Array.isArray(e.v)?e.v.join(', '):(typeof e.v==='string'?e.v:yraw(e.s))});
  return {fm,body:text.slice(m[0].length)}}

function fieldToMd(f,v,d){
  if(f.kind==='text')return String(v||'').trim();

  if(f.kind==='table'){if(!(v&&v.length))return '';const c=x=>String(x||'').replace(/\|/g,'\\|').replace(/\n/g,' ');
    return `| ${f.cols.join(' | ')} |\n|${f.cols.map(()=>' --- ').join('|')}|\n`+v.map(r=>`| ${f.cols.map((_,i)=>c(r[i])).join(' | ')} |`).join('\n')}
  if(f.kind==='steps')return (v||[]).filter(s=>(s.action||s.detail||s.caution||(s.images&&s.images.length))).map((s,i)=>`${i+1}. **${String(s.action||'').trim()||'Step'}**`+
    (s.detail?'\n'+String(s.detail).split('\n').map(l=>'   '+l).join('\n'):'')+(s.images||[]).map(im=>`\n   ![${String(im.alt||'').replace(/[\[\]]/g,'')}](${imgRef(d,im)})`).join('')+(s.caution?`\n   > ⚠ Caution: ${s.caution}`:'')).join('\n')}

  for(const e of (d.fm||[])){if(FM_KNOWN[e.k]){used.add(e.k);const val=FM_KNOWN[e.k](d)??'';out.push(String(val)===String(e.str??'')?e.raw:yamlLine(e.k,val))}
    else out.push(e.edited?yamlLine(e.k,e.v):e.raw)}
  for(const k of Object.keys(FM_KNOWN)){if(used.has(k))continue;const val=FM_KNOWN[k](d);if(val!==''&&val!=null)out.push(yamlLine(k,val))}
  let b=`# ${d.h.title||'Untitled'}\n`;let n=0;
  for(const s of sc.sections){n++;b+=`\n## ${s===REV?'Revision History':`${n}. ${s.tag} — ${s.heading}`}\n`;
    for(const f of s.fields){if(s.fields.length>1)b+=`\n### ${f.label}\n`;const m=fieldToMd(f,d.f[f.key],d);if(m)b+='\n'+m+'\n'}}
  if(d.other&&d.other.trim())b+='\n'+d.other.trim()+'\n';
  return `---\n${out.join('\n')}\n---\n\n${b}`}

const normH=s=>String(s||'').toLowerCase().replace(/[*_`#]/g,'').replace(/^\s*\d+(\.\d+)*[.)]?\s*/,'').replace(/^(why|who|what|how|overview|issue|resolution|more|before|steps|ref|log)\s*[—–-]\s*/,'').replace(/[^a-z0-9& ]+/g,' ').replace(/\s+/g,' ').trim();

  if(f.kind==='list'){const L=t.split('\n').map(x=>x.trim()).filter(Boolean);return L.map(x=>x.replace(/^([-*+]|\d+[.)])\s+/,'')).join('\n')}
  if(f.kind==='table'){const rows=t.split('\n').map(x=>x.trim()).filter(x=>x.startsWith('|')&&!/^\|[\s:|-]+\|?$/.test(x));
    const cells=r=>r.replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
    return rows.slice(1).map(r=>{const c=cells(r);return f.cols.map((_,i)=>c[i]||'')})}
  if(f.kind==='steps'){const st=[];let cur=null;
    for(const raw of t.split('\n')){const m=raw.match(/^\s{0,3}\d+[.)]\s+(.*)$/);
      if(m){const b=m[1].match(/^\*\*(.+?)\*\*\s*[:—-]?\s*(.*)$/);cur={action:b?b[1].trim():m[1].trim(),detail:b&&b[2]?b[2].trim():'',caution:''};st.push(cur);continue}
      if(!cur||!raw.trim())continue;const im=raw.match(/^\s*!\[([^\]]*)\]\(<?([^)>]+)>?\)\s*$/);
      if(im){(cur.images=cur.images||[]).push(/^data:/.test(im[2])?{alt:im[1],data:im[2],name:'image-'+uid()+'.'+((im[2].match(/^data:image\/(\w+)/)||[])[1]||'png').replace('jpeg','jpg')}:{alt:im[1],path:decodeURI(im[2]),name:decodeURI(im[2]).split('/').pop()});continue}
      const c=raw.match(/^\s*>\s*(?:⚠\s*)?\**caution:?\**\s*(.*)$/i);
      if(c)cur.caution=c[1].replace(/^\*\*\s*/,'').trim();else cur.detail=(cur.detail?cur.detail+'\n':'')+raw.trim()}

  for(const [k,hk] of Object.entries(FM_TO_H)){const e=get(k);if(e)d.h[hk]=String(e.str??'')}

  const sc=SCHEMAS[type],buckets=new Map(),other=[];let sec=null,fld=null,inOther=false;
  const push=l=>{if(inOther||!fld){other.push(l);return}buckets.get(fld.key).push(l)};
  sc.sections.forEach(s=>s.fields.forEach(f=>buckets.set(f.key,[])));
  for(const l of body.split(/\r?\n/)){const h=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(h&&h[1].length===1&&!sec&&!other.some(x=>x.trim())){other.length=0;if(!d.h.title)d.h.title=h[2].trim();continue}
    if(h&&h[1].length===2){const n=normH(h[2]);const s=sc.sections.find(s=>s===REV?/revision history|change log|version history/.test(n):normH(s.heading)===n||n.endsWith(normH(s.heading)));
      if(s){sec=s;fld=s.fields.length===1?s.fields[0]:null;inOther=false;continue}sec=null;fld=null;inOther=true;other.push(l);continue}
    if(h&&h[1].length===3&&sec&&!inOther){const n=normH(h[2]);const f=sec.fields.find(f=>normH(f.label)===n);if(f){fld=f;continue}inOther=true;other.push(l);continue}
    push(l)}
  sc.sections.forEach(s=>s.fields.forEach(f=>{d.f[f.key]=fieldFromMd(f,buckets.get(f.key).join('\n'))}));
  d.other=other.join('\n').trim();d.updated=Date.now();return d}
const isMd=d=>d._fmt!=='json';

  if(/^\d{4}-\d{2}-\d{2}$/.test(String(v)))return `<input type="date" data-pi="${i}" value="${esc(v)}" ${dis}>`;
  return `<input data-pi="${i}" value="${esc(v)}" ${dis}>`}

   ${ro?'<div class="hint">Read-only: your access to this source doesn’t allow edits.</div>':`<div class="row"><input id="npKey" placeholder="New property name" style="flex:1;min-width:140px"><select id="npType" style="width:auto"><option value="text">Text</option><option value="list">List</option><option value="date">Date</option><option value="number">Number</option><option value="bool">Yes/No</option></select><input id="npVal" placeholder="Value" style="flex:1;min-width:140px"><button class="btn sm" onclick="addProp()">+ Add property</button></div>`}

  if(r.status===204)return null;const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){j=txt}

const b64e=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};

async function relayLogin(relay,clientId,onCode){RELAY_CANCEL=false;const R=relay.replace(/\/+$/,'');const P=(u,b)=>fetch(R+u,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
  let j;try{j=await P('/login/device/code',{client_id:clientId,scope:'repo'})}catch(e){throw new Error('Could not reach the sign-in relay at '+R)}
  if(!j.device_code)throw new Error(j.error_description||j.error||'The relay did not return a sign-in code');
  onCode(j);let iv=(j.interval||5)*1000;const end=Date.now()+(j.expires_in||900)*1000;
  while(Date.now()<end){await new Promise(r=>setTimeout(r,iv));if(RELAY_CANCEL)throw new Error('Sign-in cancelled');
    const t=await P('/login/oauth/access_token',{client_id:clientId,device_code:j.device_code,grant_type:'urn:ietf:params:oauth:grant-type:device_code'});
    if(t.access_token)return t.access_token;if(t.error==='slow_down')iv+=5000;else if(t.error&&t.error!=='authorization_pending')throw new Error(t.error_description||t.error)}
  throw new Error('Sign-in timed out')}

/* ---- connect / load ---- */
function parseRepo(s){s=String(s||'').trim().replace(/\.git$/,'');const m=s.match(/github\.com[/:]([^/\s]+)\/([^/\s#?]+)/)||s.match(/^([\w.-]+)\/([\w.-]+)$/);return m?{owner:m[1],repo:m[2]}:null}

  const R={owner:repo.owner.login,repo:repo.name,branch:c.branch||repo.default_branch,path:(c.path||'').replace(/^\/+|\/+$/g,''),token,login:user.login,perm:p,canWrite:!!(p.push||p.maintain||p.admin),auth:c.auth||'token',relayUrl:c.relayUrl||'',clientId:c.clientId||'',defaultBranch:repo.default_branch,cfg:null,private:repo.private};
  const prev=REPO;REPO=R;
  try{const f=await ghFile(joinP(R.path,FLAG),R.branch);
    if(!f){REPO=prev;return {needInit:true,R}}
    let cfg;try{cfg=JSON.parse(f.text)}catch(e){throw new Error(`${FLAG} at that path is not valid JSON`)}
    if(cfg.switchboard!=='docs')throw new Error(`${FLAG} doesn’t identify a Switchboard docs root`);
    R.cfg=cfg;R.flagSha=f.sha}catch(e){REPO=prev;throw e}
  if(DIR){DIR=null}if(!BROWSER_DRAFTS)BROWSER_DRAFTS=S.drafts;REPO=R;
  if(R.cfg.branding)S.profile=Object.assign(defaultProfile(),R.cfg.branding);
  lsSet(tokKey(R.owner,R.repo),token);const conn={kind:'repo',owner:R.owner,repo:R.repo,branch:R.branch,path:R.path,auth:R.auth,relayUrl:R.relayUrl,clientId:R.clientId};
  lsSet(KEY+'-conn',conn);lsSet(KEY+'-recent',[conn,...lsGet(KEY+'-recent',[]).filter(x=>!(x.kind==='repo'&&x.owner===conn.owner&&x.repo===conn.repo&&x.path===conn.path))].slice(0,6));
  await loadFromRepo();if(!silent)toast(`Connected to ${repoLabel()} as ${R.login} (${roleName(R.perm)})`);setSync();save();return {ok:true}}
async function initRepo(R){REPO=R;const cfg={switchboard:'docs',version:1,publishBranch:R.branch,docsPath:R.path,auth:{modes:['token',...(R.relayUrl?['relay']:[])],...(R.relayUrl?{relayUrl:R.relayUrl,clientId:R.clientId}:{})},branding:S.profile};
  const txt=JSON.stringify(cfg,null,2)+'\n',path=joinP(R.path,FLAG);
  try{await ghPut(path,txt,R.branch,'Initialize Switchboard docs root');REPO=null;return {direct:true}}

    const br='docs/switchboard-init';await ghEnsureBranch(br);const cur=await ghFile(path,br);await ghPut(path,txt,br,'Initialize Switchboard docs root',cur&&cur.sha);
    const pr=await ghEnsurePR(br,'Initialize Switchboard docs root',`Adds \`${path}\` so Muninn can use this folder.`);REPO=null;return {pr}}}

  const files=(tree.tree||[]).filter(t=>t.type==='blob'&&t.path.startsWith(pre)&&t.path.endsWith('.md'));const docs=[];
  await pool(files,8,async t=>{try{const d=mdToDoc(await blobText(t.sha),t.path);if(d){d._repo={path:t.path,branch:REPO.branch};docs.push(d)}}catch(e){}});
  let prs=[];try{prs=await gh('GET',rp(`/pulls?state=open&base=${encodeURIComponent(REPO.branch)}&per_page=100`))}catch(e){}
  for(const pr of prs.filter(p=>p.head&&p.head.ref.startsWith('docs/')&&p.head.repo&&p.head.repo.full_name.toLowerCase()===repoLabel().toLowerCase())){
    let fl=[];try{fl=await gh('GET',rp(`/pulls/${pr.number}/files?per_page=100`))}catch(e){}
    for(const x of fl.filter(x=>x.filename.startsWith(pre)&&x.filename.endsWith('.md'))){

  else{el.style.display='none';if(manual&&UPD)toast(UPD.newer?'Update available':'You’re on the latest version ('+MUNINN.version+')')}}
function footerHTML(){return `<footer class="appfoot"><span><b>Muninn</b> v${MUNINN.version}</span><span>${esc(NOTICE)}</span><a href="#help-about">About &amp; license</a></footer>`}

/* ================= REPO LOAD CACHE ================= */
async function blobText(sha){const b=await gh('GET',rp(`/git/blobs/${sha}`));return b64d(b.content)}

/* ================= IMPORT & MIGRATE (external documents, legacy drafts) ================= */
const IMPORT_EXT=['docx','md','markdown','txt','html','htm'];
function mdInline(s){return esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>/^data:image\//.test(u)?`<img src="${u}" alt="${a}">`:`[image: ${a||u}]`)
  .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>b||a).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'$1 ($2)')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function mdToHtml(md){const L=String(md).replace(/\r/g,'').split('\n');const out=[];let i=0;const isList=x=>/^\s*([-*+]|\d+[.)])\s+/.test(x);
  while(i<L.length){const l=L[i];let m;if(!l.trim()){i++;continue}
    if(m=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/)){out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*```/.test(l)){const b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;out.push('<p>'+esc(b.join('\n'))+'</p>');continue}
    if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);
      const R=rows.filter(r=>!/^\s*\|[\s:|-]+\|?\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>mdInline(c.trim().replace(/\\\|/g,'|'))));
      out.push('<table>'+R.map((r,k)=>'<tr>'+r.map(c=>k?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</table>');continue}
    if(isList(l)){const ordered=/^\s*\d/.test(l),items=[];
      while(i<L.length&&(isList(L[i])||(items.length&&/^\s{2,}\S/.test(L[i])))){const x=L[i++],mm=x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if(mm&&mm[1].length<2){items.push([mm[3]]);continue}const t=x.trim(),it=items[items.length-1];
        if(/^([-*+]|\d+[.)])\s+/.test(t)||/^>/.test(t))it.push(t.replace(/^([-*+]|\d+[.)])\s+/,''));else it[0]+=(/^\*\*[^*]+\*\*$/.test(it[0].trim())?' ':' ')+t}
      out.push(`<${ordered?'ol':'ul'}>`+items.map(it=>{const sub=it.slice(1),cau=sub.filter(s=>/^>\s*/.test(s)),rest=sub.filter(s=>!/^>\s*/.test(s));
        return `<li>${mdInline(it[0])}${rest.length?'<ul>'+rest.map(s=>`<li>${mdInline(s)}</li>`).join('')+'</ul>':''}</li>`+cau.map(c=>`</${ordered?'ol':'ul'}><p>${mdInline(c.replace(/^>\s*(⚠\s*)?/,''))}</p><${ordered?'ol':'ul'}>`).join('')}).join('')+`</${ordered?'ol':'ul'}>`);continue}
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,''));out.push('<p>'+mdInline(b.join(' '))+'</p>');continue}
    const b=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|\s*```|\s*\||\s*>)/.test(L[i])&&!isList(L[i]))b.push(L[i++]);out.push('<p>'+mdInline(b.join(' '))+'</p>')}
  return out.join('\n').replace(/<(ol|ul)><\/\1>/g,'')}
function txtToHtml(t){return String(t).replace(/\r/g,'').split(/\n\s*\n/).map(p=>{const s=p.trim();if(!s)return '';const one=!s.includes('\n');
  if(one&&s.length<70&&(/:$/.test(s)||(s===s.toUpperCase()&&/[A-Z]/.test(s))||/^\d+(\.\d+)*\s+[A-Z]/.test(s)))return `<h2>${esc(s.replace(/:$/,''))}</h2>`;
  const lines=s.split('\n');if(lines.every(x=>/^\s*([-*•]|\d+[.)])\s+/.test(x)))return `<${/^\s*\d/.test(lines[0])?'ol':'ul'}>`+lines.map(x=>`<li>${esc(x.replace(/^\s*([-*•]|\d+[.)])\s+/,''))}</li>`).join('')+`</${/^\s*\d/.test(lines[0])?'ol':'ul'}>`;
  return `<p>${esc(s).replace(/\n/g,' ')}</p>`}).join('\n')}
async function sourceToHtml(name,data){const ext=(name.split('.').pop()||'').toLowerCase();
  if(ext==='docx'){if(!window.mammoth)await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
    const buf=typeof data==='string'?Uint8Array.from(atob(data),c=>c.charCodeAt(0)).buffer:data;const r=await mammoth.convertToHtml({arrayBuffer:buf},{styleMap:["p[style-name='Title'] => h1:fresh"]});return {html:r.value,fm:null}}
  const text=typeof data==='string'?data:new TextDecoder().decode(data);
  if(ext==='md'||ext==='markdown'){const {fm,body}=parseFM(text);return {html:mdToHtml(body),fm}}
  if(ext==='html'||ext==='htm'){const d=new DOMParser().parseFromString(text,'text/html');d.querySelectorAll('script,style,nav,header,footer,noscript,iframe').forEach(x=>x.remove());return {html:d.body.innerHTML,fm:null,title:d.title}}
  return {html:txtToHtml(text),fm:null}}
async function startImport(name,data,origin){const {html,fm,title}=await sourceToHtml(name,data);const r=chunksFromHtml(html);if(!r.chunks.length)throw new Error('No readable content found');
  const fmTitle=fm&&fm.find(e=>e.k==='title');const type=guessType(r.chunks);
  WI={step:'map',file:name,origin:origin||{kind:'upload'},fm:fm?fm.filter(e=>!FM_KNOWN[e.k]):null,fmKnown:fm?fm.filter(e=>FM_KNOWN[e.k]):null,archive:true,
    title:r.title||(fmTitle&&String(fmTitle.str))||title||name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),type,chunks:r.chunks};
  r.chunks.forEach(c=>Object.assign(c,autoMap(c,type)));drawWI()}
async function scanLibrary(){const out=[];
  if(DIR){async function walk(dh,path,depth){if(depth>6)return;for await(const [n,h] of dh.entries()){
      if(h.kind==='directory'){if(n.startsWith('.')||['_Archive','_templater','assets','node_modules'].includes(n))continue;await walk(h,[...path,n],depth+1);continue}
      const ext=(n.split('.').pop()||'').toLowerCase();if(!IMPORT_EXT.includes(ext)||n.startsWith('~$'))continue;
      if(ext==='md'){try{const t=await (await h.getFile()).text();if(mdToDoc(t))continue}catch(e){continue}}
      out.push({name:n,path,ext,src:'dir'})}}
    await walk(DIR,[],0)}
  else if(REPO){const tree=await gh('GET',rp(`/git/trees/${encodeURIComponent(REPO.branch)}?recursive=1`));const pre=REPO.path?REPO.path+'/':'';const known=new Set(S.drafts.map(d=>d._repo&&d._repo.path).filter(Boolean));
    (tree.tree||[]).forEach(t=>{if(t.type!=='blob'||!t.path.startsWith(pre)||known.has(t.path)||/(^|\/)(assets|_Archive|\.)/.test(t.path.slice(pre.length)))return;const n=t.path.split('/').pop(),ext=(n.split('.').pop()||'').toLowerCase();
      if(!IMPORT_EXT.includes(ext)||n===FLAG)return;out.push({name:n,path:t.path.split('/').slice(0,-1),ext,src:'repo',full:t.path})})}
  return out.sort((a,b)=>(a.path.join('/')+a.name).localeCompare(b.path.join('/')+b.name))}
async function importFromLibrary(i){const it=WI.scan[i];$('#wiMsg').textContent='Reading '+it.name+'…';
  try{let data;if(it.src==='dir'){const f=await (await (await sub(it.path,false)).getFileHandle(it.name)).getFile();data=it.ext==='docx'?await f.arrayBuffer():await f.text()}
    else{const j=await gh('GET',rp(`/contents/${encP(it.full)}?ref=${encodeURIComponent(REPO.branch)}`));let b64=j.content;if(!b64){b64=(await gh('GET',rp(`/git/blobs/${j.sha}`))).content}b64=String(b64).replace(/\s/g,'');data=it.ext==='docx'?b64:b64d(b64)}
    await startImport(it.name,data,{kind:it.src,path:it.path,name:it.name,full:it.full})}
  catch(e){$('#wiMsg').textContent='⚠ '+e.message}}
async function convertLegacy(){const L=S.drafts.filter(d=>d._fmt==='json');if(!L.length)return;let n=0;
  try{await flushP;for(const d of L){if(DIR&&d._file){try{await writeAt(['_Archive',...d._file.path],d._file.name,serial(d))}catch(e){}}d._fmt='md';n++}
    save();toast(`Converting ${n} draft(s) to Markdown — originals kept in _Archive`);WI.scan=null;drawWI()}catch(e){toast('Conversion failed: '+e.message)}}
async function archiveOriginal(o){if(o.kind==='dir'&&DIR){const dh=await sub(o.path,false);const f=await (await dh.getFileHandle(o.name)).getFile();
  await writeAt(['_Archive',...o.path],o.name,await f.arrayBuffer());await dh.removeEntry(o.name)}}
function drawPick(box){const lib=!!(DIR||REPO),tab=WI.tab||(lib?'library':'upload'),legacy=S.drafts.filter(d=>d._fmt==='json');
  box.innerHTML=`<div class="row"><b style="font-size:16px">Import &amp; migrate</b><span class="spacer"></span><button class="btn sm" onclick="closeWI()">Close</button></div>
   <p class="hint" style="margin:0">Bring existing documents into a Muninn template. Muninn splits each one at its headings, matches the parts to template sections, and lets you review every match before a draft is created. Original files are never edited.</p>
   <div class="seg" style="align-self:flex-start"><button class="${tab==='upload'?'on':''}" onclick="WI.tab='upload';drawWI()">From your computer</button><button class="${tab==='library'?'on':''}" onclick="WI.tab='library';drawWI()">From this library</button></div>
   ${tab==='upload'?`<div class="card" style="margin:0"><label class="btn pri">Choose a file<input type="file" accept=".docx,.md,.markdown,.txt,.html,.htm" id="wiFile" hidden></label>
      <div class="hint" style="margin-top:8px">Word (.docx), Markdown (.md, Obsidian notes keep their properties), web pages (.html) and plain text (.txt). For PDFs, open them in Word and save as .docx first.</div></div>`
   :!lib?`<div class="card" style="margin:0"><div class="hint">Connect a folder or GitHub repo to find documents already stored there. <a href="#connect" onclick="closeWI()">Connect…</a></div></div>`
   :`${legacy.length?`<div class="callout row" style="margin:0"><span><b>${legacy.length} older draft(s)</b> are stored in the previous <span class="mono">.sopkba.json</span> format.</span><span class="spacer"></span><button class="btn sm pri" onclick="convertLegacy()">Convert to Markdown</button></div><div class="hint">Converted drafts keep everything; the original files are kept in <span class="mono">_Archive</span>.</div>`:''}
     <div class="card" style="margin:0;padding:0;max-height:52vh;overflow:auto" id="wiScan"><div class="hint" style="padding:14px">Looking for documents Muninn doesn’t manage yet…</div></div>`}
   <div class="hint" id="wiMsg"></div>
   <div class="card" style="opacity:.65;margin:0"><b>Edit Word files directly</b> <span class="pill">Coming later</span><div class="hint">Open, edit and save .docx in place (with Word file properties). Planned as a separate feature.</div></div>`;
  const fi=$('#wiFile');if(fi)fi.onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#wiMsg').textContent='Reading '+f.name+'…';
    try{const ext=(f.name.split('.').pop()||'').toLowerCase();await startImport(f.name,ext==='docx'?await f.arrayBuffer():await f.text(),{kind:'upload'})}catch(x){$('#wiMsg').textContent='⚠ '+x.message}};
  if(tab==='library'&&lib){const paint=()=>{const el=$('#wiScan');if(!el)return;const L=WI.scan||[];
      el.innerHTML=L.length?`<table class="list"><thead><tr><th>File</th><th>Folder</th><th>Type</th><th></th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${fileIcon(x.name)} ${esc(x.name)}</td><td class="hint mono">${esc(x.path.join('/')||'/')}</td><td class="hint">${esc(x.ext.toUpperCase())}</td><td style="text-align:right"><button class="btn sm" onclick="importFromLibrary(${i})">Import…</button></td></tr>`).join('')}</tbody></table>`
        :'<div class="hint" style="padding:14px">No outside documents found — everything here is already managed by Muninn.</div>'};
    if(WI.scan)paint();else scanLibrary().then(r=>{WI.scan=r;paint()}).catch(e=>{const el=$('#wiScan');if(el)el.innerHTML=`<div class="hint" style="padding:14px">⚠ ${esc(e.message)}</div>`})}}

function flow(id,title,nodes,edges,h){/* nodes: [key,x,y,w,label,sub,accent] */const N=Object.fromEntries(nodes.map(n=>[n[0],n]));
  return `<svg class="hdia" viewBox="0 0 760 ${h}" role="img" aria-label="${esc(title)}"><defs><marker id="${id}-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a939c"/></marker></defs>
   <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2329">${esc(title)}</text>
   ${edges.map(([a,b,lab,path])=>{const A=N[a],B=N[b];const d=path||`M${A[1]+A[3]/2} ${A[2]}L${B[1]-B[3]/2} ${B[2]}`;return `<path d="${d}" fill="none" stroke="#8a939c" stroke-width="1.25" marker-end="url(#${id}-a)"/>${lab?`<text x="${lab[1]}" y="${lab[2]}" font-size="11" fill="#66707a" text-anchor="middle">${esc(lab[0])}</text>`:''}`}).join('')}
   ${nodes.map(([k,x,y,w,label,sub,acc])=>`<g><rect x="${x-w/2}" y="${y-(sub?26:20)}" width="${w}" height="${sub?52:40}" rx="8" fill="${acc?'var(--t)':'#fff'}" stroke="${acc?'var(--p)':'#b9c1ca'}" stroke-width="${acc?2:1.25}"/><text x="${x}" y="${y+(sub?-4:4)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2329">${esc(label)}</text>${sub?`<text x="${x}" y="${y+13}" text-anchor="middle" font-size="10.5" fill="#66707a">${esc(sub)}</text>`:''}</g>`).join('')}</svg>`}
